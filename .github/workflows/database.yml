name: Database and security verification
on:
  workflow_call:
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v2
        with:
          version: 2.121.0
      # setup-cli v2 installs its own Bun; restore the app's selected version afterwards.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.5
      - run: bun install --frozen-lockfile
      - name: Start an isolated local Supabase platform
        run: |
          mkdir -p supabase/.temp/release-check
          sed -i '/\[db.migrations\]/,/^\[/s/enabled = false/enabled = true/' supabase/config.toml
          sed -i '/\[db.seed\]/,/^\[/s/enabled = true/enabled = false/' supabase/config.toml
          supabase start -x studio,storage-api,imgproxy,realtime,edge-runtime,logflare,vector,supavisor > supabase/.temp/release-check/platform.log 2>&1 \
            || { cat supabase/.temp/release-check/platform.log; exit 1; }
      - name: Replay, upgrade and exercise real Auth and PostgreSQL
        run: |
          bun scripts/prepareReleaseDb.ts typa_release_fresh
          bun scripts/verifyReleaseDb.ts typa_release_fresh
          bun scripts/verifyReleaseApi.ts typa_release_fresh
          bun scripts/prepareReleaseDb.ts typa_release_verify
          bun scripts/verifyReleaseDb.ts typa_release_verify
          bun scripts/verifyReleaseApi.ts typa_release_verify
      # Both clean installation and upgrade must satisfy the same mandatory ASVS-derived checks.
      # Each command starts real Auth/PostgREST and a digest-pinned ZAP Automation Framework
      # against its isolated database. Missing evidence or a scanner failure fails this job.
      - name: Verify security requirements on the fresh database
        run: bun scripts/verifySecurity.ts typa_release_fresh
      - name: Verify security requirements on the upgraded database
        run: bun scripts/verifySecurity.ts typa_release_verify
      - name: Preserve redacted security evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-evidence
          path: supabase/.temp/security-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          # 依存のどれかが変わるたびに取り直さないよう、Playwright の版だけで決める
          key: playwright-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/package.json') }}
      # apt は使わない。Ubuntu の Azure ミラーは、ときどき途中で詰まったまま戻らない。
      # Chromium の動作に要るライブラリはランナーに揃っている(--with-deps が入れていたのは使わないフォントだけ)。
      # 画面写真の和文は Noto Sans CJK JP(fonts-noto-cjk と同じ Regular / Bold)を GitHub から版を固定して取る
      - name: Cache Japanese fonts
        id: fonts
        uses: actions/cache@v6
        with:
          path: ~/.local/share/fonts/noto-cjk
          key: noto-sans-cjk-jp-Sans2.004
      - name: Download Japanese fonts
        if: steps.fonts.outputs.cache-hit != 'true'
        timeout-minutes: 3
        run: |
          mkdir -p ~/.local/share/fonts/noto-cjk
          cd ~/.local/share/fonts/noto-cjk
          base=https://raw.githubusercontent.com/notofonts/noto-cjk/Sans2.004/Sans/OTF/Japanese
          curl -fsSL --retry 5 --max-time 60 -O "$base/NotoSansCJKjp-Regular.otf" -O "$base/NotoSansCJKjp-Bold.otf"
          sha256sum -c - <<'EOF'
          68a3fc98800b2a27b371f2fb79991daf3633bd89309d4ffaa6946fd587f375b5  NotoSansCJKjp-Regular.otf
          e53dcb0dcb2922e45d01aae1ebd2f382bb81d4229b18b6b883bd170678af1f76  NotoSansCJKjp-Bold.otf
          EOF
      - name: Install Chromium for end-to-end tests and screenshots
        timeout-minutes: 5
        run: |
          fc-cache -f ~/.local/share/fonts
          fc-list | grep -q "Noto Sans CJK JP"
          bunx playwright install --only-shell chromium
      - name: Exercise the UI end to end against the same platform
        run: bun run test:e2e
      # E2E を通った同じ環境で、マニュアルの画面写真と PDF を一度だけ作る。リリースはこれを使い回す
      - name: Take manual screenshots and PDFs
        run: bun run docs:user-manual
      - uses: actions/upload-artifact@v7
        with:
          name: manual
          path: |
            docs/manual/**/*.png
            docs/manual/*.pdf
          if-no-files-found: error
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - if: always()
        run: |
          docker rm -f typa_security_zap typa_release_auth typa_release_rest 2>/dev/null || true
          supabase stop --no-backup
