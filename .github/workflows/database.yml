name: Real database release checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v2
        with:
          version: 2.121.0
      # setup-cli v2 installs its own Bun; restore the app's selected version afterwards.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.5
      - run: bun install --frozen-lockfile
      - name: Start an isolated local Supabase platform
        run: |
          mkdir -p supabase/.temp/release-check
          sed -i '/\[db.migrations\]/,/^\[/s/enabled = false/enabled = true/' supabase/config.toml
          sed -i '/\[db.seed\]/,/^\[/s/enabled = true/enabled = false/' supabase/config.toml
          supabase start -x studio,storage-api,imgproxy,realtime,edge-runtime,logflare,vector,supavisor > supabase/.temp/release-check/platform.log 2>&1 \
            || { cat supabase/.temp/release-check/platform.log; exit 1; }
      - name: Replay, upgrade and exercise real Auth and PostgreSQL
        run: |
          bun scripts/prepareReleaseDb.ts typa_release_fresh
          bun scripts/verifyReleaseDb.ts typa_release_fresh
          bun scripts/verifyReleaseApi.ts typa_release_fresh
          bun scripts/prepareReleaseDb.ts typa_release_verify
          bun scripts/verifyReleaseDb.ts typa_release_verify
          bun scripts/verifyReleaseApi.ts typa_release_verify
      - name: Exercise the UI end to end against the same platform
        run: |
          bunx playwright install --with-deps chromium
          bun run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - if: always()
        run: supabase stop --no-backup
