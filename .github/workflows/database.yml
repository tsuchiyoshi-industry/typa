name: Database and security verification
on:
  workflow_call:
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v2
        with:
          version: 2.121.0
      # setup-cli v2 installs its own Bun; restore the app's selected version afterwards.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.5
      - run: bun install --frozen-lockfile
      - name: Start an isolated local Supabase platform
        run: |
          mkdir -p supabase/.temp/release-check
          sed -i '/\[db.migrations\]/,/^\[/s/enabled = false/enabled = true/' supabase/config.toml
          sed -i '/\[db.seed\]/,/^\[/s/enabled = true/enabled = false/' supabase/config.toml
          supabase start -x studio,storage-api,imgproxy,realtime,edge-runtime,logflare,vector,supavisor > supabase/.temp/release-check/platform.log 2>&1 \
            || { cat supabase/.temp/release-check/platform.log; exit 1; }
      - name: Replay, upgrade and exercise real Auth and PostgreSQL
        run: |
          bun scripts/prepareReleaseDb.ts typa_release_fresh
          bun scripts/verifyReleaseDb.ts typa_release_fresh
          bun scripts/verifyReleaseApi.ts typa_release_fresh
          bun scripts/prepareReleaseDb.ts typa_release_verify
          bun scripts/verifyReleaseDb.ts typa_release_verify
          bun scripts/verifyReleaseApi.ts typa_release_verify
      # Both clean installation and upgrade must satisfy the same mandatory ASVS-derived checks.
      # Each command starts real Auth/PostgREST and a digest-pinned ZAP Automation Framework
      # against its isolated database. Missing evidence or a scanner failure fails this job.
      - name: Verify security requirements on the fresh database
        run: bun scripts/verifySecurity.ts typa_release_fresh
      - name: Verify security requirements on the upgraded database
        run: bun scripts/verifySecurity.ts typa_release_verify
      - name: Preserve redacted security evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-evidence
          path: supabase/.temp/security-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # apt のミラーが詰まると、時間切れなしで待ち続ける(普段は 20 秒)。詰まったら切って取り直す
      - name: Install Chromium and Japanese fonts for screenshots
        timeout-minutes: 8
        run: |
          echo 'Acquire::http::Timeout "30"; Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/99ci-network
          bunx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Exercise the UI end to end against the same platform
        run: bun run test:e2e
      # E2E を通った同じ環境で、マニュアルの画面写真と PDF を一度だけ作る。リリースはこれを使い回す
      - name: Take manual screenshots and PDFs
        run: bun run docs:user-manual
      - uses: actions/upload-artifact@v7
        with:
          name: manual
          path: |
            docs/manual/**/*.png
            docs/manual/*.pdf
          if-no-files-found: error
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - if: always()
        run: |
          docker rm -f typa_security_zap typa_release_auth typa_release_rest 2>/dev/null || true
          supabase stop --no-backup
