name: Release
run-name: Release ${{ inputs.version || github.ref_name }} by @${{ github.actor }}

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Manual version 1.2.3 and pushed tag v1.2.3 publish the same release.
  group: release-${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
    env:
      VERSION_INPUT: ${{ inputs.version }}
      REF_NAME: ${{ github.ref_name }}
      EVENT_NAME: ${{ github.event_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version and tag
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$VERSION_INPUT"
            if [[ -z "$VERSION" ]]; then
              echo "version input is required"
              exit 1
            fi
          else
            TAG_FROM_REF="$REF_NAME"
            VERSION="${TAG_FROM_REF#v}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate packaged versions and existing tag
        shell: bash
        run: |
          bun scripts/releaseVersion.ts "${{ steps.release_meta.outputs.version }}"
          TAG="${{ steps.release_meta.outputs.tag }}"
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$TAG")" = "$(git rev-parse HEAD)" || { echo "Tag points to a different commit"; exit 1; }
          fi

  # Run the same checks as CI once; their independent jobs run in parallel.
  checks:
    needs: metadata
    uses: ./.github/workflows/test.yml

  build-and-release:
    needs: [metadata, checks]
    runs-on: windows-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        shell: bash
        run: bun install --frozen-lockfile

      # checks が撮ったマニュアルの写真と PDF。写真はアプリのヘルプに入り、PDF はリリースに添える
      - name: Download manual
        uses: actions/download-artifact@v8
        with:
          name: manual
          path: docs/manual

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Restore the release-profile dependencies saved by checks / rust in this run.
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-tauri
          save-if: false
          workspaces: src-tauri -> target

      - name: Build bundle
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: bun run tauri build

      - name: Ensure release assets exist
        shell: bash
        run: |
          set -euo pipefail

          find src-tauri/target/release/bundle -type f \( \
            -name "*.msi" -o \
            -name "*.msi.sig" -o \
            -name "*.exe" -o \
            -name "*.exe.sig" \) > release-assets.txt

          if [[ ! -s release-assets.txt ]]; then
            echo "No bundle artifacts found"
            exit 1
          fi

      # リリースの一覧で何の PDF か分かる名前で添える。GitHub は添付の名前の日本語を置き換えるので英数字にする
      # (日本語名だと3冊が同じ名前になり、アップロードが Not Found で止まった)
      - name: Name manual PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p manual
          cp docs/manual/user.pdf manual/TYPA-user-guide.pdf
          cp docs/manual/evaluator.pdf manual/TYPA-evaluator-guide.pdf
          cp docs/manual/admin.pdf manual/TYPA-admin-guide.pdf

      - name: Generate release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          TAG="${{ needs.metadata.outputs.tag }}"

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f target_commitish="${{ github.sha }}" \
            --jq '.body' > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "TYPA ${TAG} の更新です。" > release-notes.md
          fi

      - name: Generate latest.json
        shell: bash
        env:
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          VERSION="${{ needs.metadata.outputs.version }}"
          TAG="${{ needs.metadata.outputs.tag }}"
          BASE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # 自動更新は NSIS のインストーラーだけを配る
          NSIS_SIG=""
          NSIS_SIG_FILE=$(find src-tauri/target/release/bundle -name "*-setup.exe.sig" | head -1)
          NSIS_FILE=$(find src-tauri/target/release/bundle -name "*-setup.exe" ! -name "*.sig" | head -1)
          if [[ -n "$NSIS_SIG_FILE" ]]; then
            NSIS_SIG=$(cat "$NSIS_SIG_FILE")
          fi
          if [[ -z "$NSIS_SIG" || -z "$NSIS_FILE" ]]; then
            echo "Signed NSIS updater assets are required"
            exit 1
          fi
          NSIS_NAME=$(basename "$NSIS_FILE")

          cat > latest.json << EOF
          {
            "version": "${VERSION}",
            "pub_date": "${PUB_DATE}",
            "notes": "",
            "platforms": {
              "windows-x86_64": {
                "signature": "${NSIS_SIG}",
                "url": "${BASE_URL}/${NSIS_NAME}"
              }
            }
          }
          EOF

          # Remove leading whitespace from heredoc
          python3 -c "
          import json, sys
          with open('latest.json') as f:
              data = json.load(f)
          with open('release-notes.md', encoding='utf-8') as f:
              data['notes'] = f.read().strip()
          with open('latest.json', 'w') as f:
              json.dump(data, f, indent=2)
          "

          echo "Generated latest.json:"
          cat latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          # workflow_dispatch ではタグがまだない。git push で打つと、前回のリリースから
          # ワークフローが変わったコミットを GITHUB_TOKEN では拒否されるので、リリース作成時に作らせる
          target_commitish: ${{ github.sha }}
          name: ${{ needs.metadata.outputs.tag }}
          prerelease: ${{ contains(needs.metadata.outputs.version, '-') }}
          make_latest: ${{ !contains(needs.metadata.outputs.version, '-') }}
          body_path: release-notes.md
          files: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.msi.sig
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.exe.sig
            latest.json
            manual/*.pdf

  # Web 版(https://typa.tyco.co.jp)。デスクトップ版のリリースが公開できたら、同じコミットを Cloudflare Pages に出す。
  # Web は公開した瞬間に全員が新しい版になるので、DB のマイグレーションはリリースより前に当てておく
  deploy-web:
    needs: [metadata, build-and-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # 写真はアプリのヘルプに入る(デスクトップ版と同じ)
      - name: Download manual
        uses: actions/download-artifact@v8
        with:
          name: manual
          path: docs/manual

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # checks の E2E が保存した WASM 用の依存を使う
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-pdf
          save-if: false
          workspaces: src-tauri -> target

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: bun run build:web

      # 404.html があると、Pages は画面の URL(/sheet/1 など)を index.html に回さなくなる
      - name: Check the build is a single-page app
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/_headers
          test -f dist/typa-pdf.wasm.gz
          test ! -e dist/404.html

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=typa --branch=main --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
