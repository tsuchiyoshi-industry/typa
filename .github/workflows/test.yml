name: Release readiness tests
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  database:
    uses: ./.github/workflows/database.yml
  test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bunx playwright install chromium
      - run: bun run test:coverage
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.5
      - name: Notification function checks
        shell: bash
        env:
          OPENSSL_BIN: C:/Program Files/Git/usr/bin/openssl.exe
        run: |
          bun install --cwd supabase/functions/notify-sheet --frozen-lockfile --ignore-scripts
          deno check --config supabase/functions/notify-sheet/deno.json --frozen supabase/functions/notify-sheet/index.ts
          deno test --allow-all --config supabase/functions/notify-sheet/deno.json --frozen supabase/functions/notify-sheet/smtp.test.ts

      - uses: dtolnay/rust-toolchain@stable
      # release.yml と同じ shared-key・release プロファイルにして、main で温めたキャッシュをリリース時に使う
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: src-tauri -> target
      - run: bun run test:rust --release
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage
