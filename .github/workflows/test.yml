name: Release readiness tests
on:
  workflow_call:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read

concurrency:
  # Reusable calls use the caller's workflow name, keeping CI and Release separate.
  group: readiness-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) }}

jobs:
  # These checks use independent runners and do not consume each other's output.
  database:
    uses: ./.github/workflows/database.yml
  frontend:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run check
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/package.json') }}
      # どのテストもヘッドレス。使わない通常版 Chrome(191MB)は取らない
      - run: bunx playwright install --only-shell chromium
      - run: bun run test:coverage
      - run: bun audit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: coverage
          path: coverage

  notification:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.5
      - name: Notification function checks
        shell: bash
        env:
          OPENSSL_BIN: C:/Program Files/Git/usr/bin/openssl.exe
        run: |
          bun install --cwd supabase/functions/notify-sheet --frozen-lockfile --ignore-scripts
          bun audit --cwd supabase/functions/notify-sheet
          deno check --config supabase/functions/notify-sheet/deno.json --frozen supabase/functions/notify-sheet/index.ts
          deno test --allow-all --config supabase/functions/notify-sheet/deno.json --frozen supabase/functions/notify-sheet/smtp.test.ts

  rust:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # The release build restores these dependencies after all checks have passed.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: windows-tauri
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: src-tauri -> target
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit --file src-tauri/Cargo.lock
      # PDF の crate(src-tauri/pdf。ブラウザ版の WASM と共通)のテストも流す
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --release --workspace

  # Keep the existing "test" status as the gate for every check, including failures/skips.
  test:
    if: ${{ always() }}
    needs: [frontend, notification, rust, database]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks to pass
        run: |
          test '${{ needs.frontend.result }}' = success
          test '${{ needs.notification.result }}' = success
          test '${{ needs.rust.result }}' = success
          test '${{ needs.database.result }}' = success
