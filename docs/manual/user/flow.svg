<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP',sans-serif">
  <title>評価シートの流れ</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4d5b64"/>
    </marker>
  </defs>
  <rect width="720" height="560" fill="#ffffff"/>

  <g font-size="12" fill="#4d5b64">
    <text x="130" y="22" text-anchor="middle">シートの状態</text>
    <text x="250" y="22">次の段階に進む操作</text>
    <text x="470" y="22">記入できる内容</text>
  </g>
  <line x1="24" y1="32" x2="696" y2="32" stroke="#d6dbe0"/>

  <!-- 本人が記入する段階を塗りつぶして表示 -->
  <g font-size="15" text-anchor="middle">
    <rect x="40" y="44" width="180" height="44" rx="8" fill="#e8eff4" stroke="#315c7a"/>
    <text x="130" y="71" fill="#1b262d" font-weight="600">下書き</text>
    <rect x="40" y="134" width="180" height="44" rx="8" fill="#ffffff" stroke="#9aa5b1"/>
    <text x="130" y="161" fill="#1b262d">目標確認待ち</text>
    <rect x="40" y="224" width="180" height="44" rx="8" fill="#e8eff4" stroke="#315c7a"/>
    <text x="130" y="251" fill="#1b262d" font-weight="600">振り返り待ち</text>
    <rect x="40" y="314" width="180" height="44" rx="8" fill="#ffffff" stroke="#9aa5b1"/>
    <text x="130" y="341" fill="#1b262d">一次評価待ち</text>
    <rect x="40" y="404" width="180" height="44" rx="8" fill="#ffffff" stroke="#9aa5b1"/>
    <text x="130" y="431" fill="#1b262d">二次評価待ち</text>
    <rect x="40" y="494" width="180" height="44" rx="8" fill="#ffffff" stroke="#9aa5b1"/>
    <text x="130" y="521" fill="#1b262d">評価確定</text>
  </g>

  <!-- 進む矢印 -->
  <g stroke="#4d5b64" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="130" y1="88" x2="130" y2="132"/>
    <line x1="130" y1="178" x2="130" y2="222"/>
    <line x1="130" y1="268" x2="130" y2="312"/>
    <line x1="130" y1="358" x2="130" y2="402"/>
    <line x1="130" y1="448" x2="130" y2="492"/>
    <!-- 要修正のときは下書きへ戻る -->
    <path d="M40 156H22V66H38" stroke-dasharray="4 3"/>
  </g>

  <g font-size="13" fill="#1b262d">
    <text x="146" y="115"><tspan font-weight="600">本人</tspan>が「目標を送信する」</text>
    <text x="146" y="200"><tspan font-weight="600">一次評価者</tspan>が「目標を確定する」</text>
    <text x="146" y="217" font-size="11.5" fill="#4d5b64">修正が必要な場合は下書きに戻す（点線）</text>
    <text x="146" y="295"><tspan font-weight="600">本人</tspan>が「一次評価を依頼する」</text>
    <text x="146" y="385"><tspan font-weight="600">一次評価者</tspan>が評価して確定</text>
    <text x="146" y="475"><tspan font-weight="600">二次評価者</tspan>が評価して確定</text>
  </g>

  <g font-size="13" fill="#1b262d">
    <text x="470" y="64">チャレンジ目標・期中目標</text>
    <text x="470" y="81" font-size="11.5" fill="#4d5b64">前期の目標も引き継げます</text>
    <text x="470" y="161">記入できません</text>
    <text x="470" y="245">達成状況のみ</text>
    <text x="470" y="262" font-size="11.5" fill="#4d5b64">記入後に一次評価を依頼します</text>
    <text x="470" y="341" fill="#4d5b64">内容の確認のみできます</text>
    <text x="470" y="431" fill="#4d5b64">内容の確認のみできます</text>
    <text x="470" y="505">期間の締め後にランクを確認</text>
    <text x="470" y="523" font-size="11.5" fill="#4d5b64">点数・コメントは表示されません</text>
  </g>

  <g font-size="11.5" fill="#4d5b64">
    <rect x="470" y="530" width="14" height="10" rx="2" fill="#e8eff4" stroke="#315c7a"/>
    <text x="490" y="539">本人が記入する段階</text>
  </g>
</svg>
