[package]
name = "typa"
version = "0.7.1"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "typa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "~2.12.1", features = [] }
tauri-plugin-opener = "^2.7.0"
tauri-plugin-fs = "2.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-upload = "2.5.0"
time = { version = "^0.3.53", features = ["macros"] }
chrono = "0.4.45"
typst-as-lib = "0.16.0"
typst = "0.15.0"
typst-pdf = "0.15.0"
tauri-plugin-dialog = "^2.8.1"
tauri-plugin-process = "2.4.0"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls", "hostname"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.13.1"

[dev-dependencies]
tauri = { version = "~2.12.1", features = ["test"] }

# Upstream quick-xml >=0.41 fix, pending a citationberg crates.io release.
[patch.crates-io]
citationberg = { git = "https://github.com/typst/citationberg", rev = "8966cf7c178b38b621d297c9eb6d0bb81e14be5e" }
