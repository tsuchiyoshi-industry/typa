[package]
name = "typa"
version = "1.0.7"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "typa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "~2.12.4", features = [] }
tauri-plugin-fs = "2.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
typst-as-lib = "0.17.0"
typst = "0.15.0"
typst-pdf = "0.15.0"
tauri-plugin-dialog = "^2.8.3"
tauri-plugin-process = "2.4.0"
tauri-plugin-opener = "2.7.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.5.4"
# Updates ship as the raw NSIS -setup.exe (createUpdaterArtifacts v2), never as a zip,
# so leave out the "zip" feature: its extraction code is unreachable and its zip 4.x is vulnerable.
tauri-plugin-updater = { version = "2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"] }

[dev-dependencies]
tauri = { version = "~2.12.1", features = ["test"] }

[profile.release]
strip = true

# Upstream quick-xml >=0.41 fix, pending a citationberg crates.io release.
[patch.crates-io]
citationberg = { git = "https://github.com/typst/citationberg", rev = "8966cf7c178b38b621d297c9eb6d0bb81e14be5e" }
