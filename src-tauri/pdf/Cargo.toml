[package]
name = "typa-pdf"
version = "0.0.0"
edition = "2024"
publish = false
description = "評価シートの PDF。デスクトップ(Tauri)とブラウザ(WASM)で同じものを使う"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
comemo = "0.5.1"
typst = "0.15.0"
typst-pdf = "0.15.0"
